name: 每周更新招聘日历
on:
  schedule:
    - cron: '0 0 * * 1' # UTC 周一00:00 = 北京时间周一08:00；可能排队延迟
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scrape.py', 'template.html', 'requirements.txt', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: campus-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装公开抓取工具
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: 校验时间解析、改期去重和历史保留
        run: python -m unittest tests.py
      - name: 抓取13校并生成单文件页面
        id: scrape
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scrape.py
      - name: 验证页面确由本轮数据生成
        if: always() && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure')
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYCODE'
          import json, pathlib, os, re
          status=json.loads(pathlib.Path('data/status.json').read_text())
          rows=json.loads(pathlib.Path('data/events.json').read_text())
          html=pathlib.Path('index.html').read_text()
          assert status['run_url']==os.environ['RUN_URL'], '未生成本轮快照，拒绝发布旧页面冒充更新'
          assert json.loads(re.search(r'const EVENTS = (.*);\n',html)[1])==rows
          assert status['total']==len(rows)
          print('页面、数据库与本轮运行记录一致：',len(rows),'场')
          PYCODE
      - name: 保存数据和页面（部分学校失败也保存其余结果）
        if: success() && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure')
        run: |
          test -s index.html
          test -s data/health.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/
          if ! git diff --cached --quiet; then
            git commit -m '更新高校招聘日历与来源状态'
            git pull --rebase origin main
            git push
          fi
      - name: 打包网页
        run: |
          mkdir -p public
          cp index.html public/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-page
          path: public/
          retention-days: 7
      - name: 保存来源与质量审计报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: |
            data/status.json
            data/audit.json
            data/health.json
            data/retired-future.json
          retention-days: 30
      - name: 标记来源失败以触发失败邮件
        if: steps.scrape.outcome == 'failure'
        run: |
          echo '一个或多个学校本轮失败；可用页面已保存，详见汇总和日志。'
          exit 1
  # 单独部署：即便部分来源失败，仍发布其余更新后的页面。
  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calendar-page
          path: public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
