name: 仅发布界面（保留现有数据）
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: campus-calendar
  cancel-in-progress: false
jobs:
  publish-ui:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 仅从现有数据渲染页面，不采集、不修改数据
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          root = pathlib.Path('.')
          paths = ['data/events.json', 'data/status.json', 'data/supplements.json', 'scrape.py', '.github/workflows/update.yml']
          before = {p: hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths}
          events = json.loads((root/'data/events.json').read_text())
          status = json.loads((root/'data/status.json').read_text())
          def safe(value):
              return json.dumps(value, ensure_ascii=False).replace('<', chr(92)+'u003c').replace(chr(8232), chr(92)+'u2028').replace(chr(8233), chr(92)+'u2029')
          html = (root/'template.html').read_text().replace('__EVENTS__', safe(events)).replace('__STATUS__', safe(status))
          assert json.loads(html.split('const EVENTS = ',1)[1].split(';\n',1)[0]) == events
          pathlib.Path('public').mkdir(exist_ok=True)
          pathlib.Path('public/index.html').write_text(html)
          assert before == {p: hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths}
          print(f'界面生成成功：{len(events)}条活动逐条一致，数据库、抓取脚本、周一配置均未变动。')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 发布界面
        id: deployment
        uses: actions/deploy-pages@v4

