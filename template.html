<header class="masthead"><div class="wordmark"><span class="mark" aria-hidden="true"></span>上海高校招聘日历</div><span class="masthead-note">每周一 · 08:00 更新</span></header>
<section class="intro"><div><h1>招聘日历</h1><p>13 所高校 · 宣讲会、双选会与招聘会</p></div></section>
<section class="paper-stack" aria-label="校招月历"><div class="notebook"><span class="tape" aria-hidden="true"></span>
<div class="paper-heading"><div><p class="eyebrow">CAMPUS RECRUITMENT CALENDAR</p><div class="monthline"><span id="monthNumber" class="month-number"></span><div><h2 id="monthTitle" class="month-title"></h2><div id="monthEnglish" class="month-sub"></div></div></div></div><div class="sticker" aria-label="收录13所高校"><strong>13</strong><span>所高校</span></div></div>
<div class="filters"><div class="control"><label for="school">学校</label><select id="school"><option value="">全部学校</option></select></div><div class="control"><label for="type">类型</label><select id="type"><option value="">全部类型</option><option>宣讲会</option><option>双选会</option><option>招聘会</option></select></div><div class="control search"><span class="search-icon" aria-hidden="true"></span><input id="search" aria-label="搜索活动或地点" placeholder="找一个公司"></div><button class="quiet-btn" id="reset">重置筛选</button></div>
<div class="calendar-toolbar"><p id="totals" class="month-count" aria-live="polite"></p><nav class="month-nav" aria-label="切换月份"><button class="arrow" id="prev" aria-label="上个月">‹</button><button class="quiet-btn" id="today">回到本月</button><button class="arrow next" id="next" aria-label="下个月">›</button></nav></div><div id="calendar" class="calendar" aria-label="招聘月历"></div><div class="paper-bottom"><p>点击日期查看当天场次。</p><button id="openToday">查看今天 ↗</button></div>
</div></section>
<section class="under-notes"><div class="small-note"><p class="eyebrow">今日活动</p><div class="note-head"><h2 id="todayNoteTitle"></h2><button id="todayNoteOpen" class="note-button" aria-label="打开今天的全部活动">↗</button></div><p id="todayNoteText"></p></div><div class="status-note"><h2>数据更新</h2><p id="updated"></p><p id="healthNotice"></p><p>时间均为北京时间，具体安排以学校官网为准。<span id="run"></span></p></div></section>
<details class="sources"><summary>学校来源与更新状态</summary><div id="schools" class="schools"></div></details><footer><span>上海高校招聘信息</span><span>历史场次保留。</span></footer>
</main>
<dialog id="detail" aria-labelledby="dayTitle"><div class="dialog-top"><div class="dialog-head"><div><p id="dayYear" class="dialog-eyebrow"></p><h2 id="dayTitle"></h2></div><button id="close" class="close" aria-label="关闭当天场次">×</button></div><div class="day-tools"><div class="control"><label for="daySchool">当天学校</label><select id="daySchool"></select></div><div class="control search"><span class="search-icon" aria-hidden="true"></span><input id="daySearch" aria-label="搜索当天活动" placeholder="在当天场次中搜索…"></div></div><p class="day-summary"><span id="daySummary" aria-live="polite"></span><button id="dayReset" class="text-btn">清除当天筛选</button></p></div><div id="dayEvents" class="event-list"></div></dialog>
<script>
const EVENTS = __EVENTS__;
const STATUS = __STATUS__;
const $=s=>document.querySelector(s);
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const chinaToday=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const current=chinaToday();let [year,month]=current.split('-').map(Number);month--;let selectedDate=current,openedDate=current;
const names=Object.keys(STATUS.sources),weekdays=['日','一','二','三','四','五','六'],english=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const stamp=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const includes=(e,q)=>[e.co,e.venue,e.school].join(' ').toLowerCase().includes(q.trim().toLowerCase());
const baseMatches=e=>(!$('#type').value||e.type===$('#type').value)&&includes(e,$('#search').value);
const matches=e=>baseMatches(e)&&(!$('#school').value||e.school===$('#school').value);
function renderDay(){const box=$('#dayEvents');box.replaceChildren();const rows=EVENTS.filter(e=>e.d===openedDate&&baseMatches(e)&&(!$('#daySchool').value||e.school===$('#daySchool').value)&&includes(e,$('#daySearch').value));const hasMainFilters=$('#type').value||$('#search').value;$('#daySummary').textContent=`${rows.length} 场活动${hasMainFilters?' · 沿用月历的类型 / 关键词筛选':''}`;if(!rows.length){const empty=el('div',undefined,'empty');empty.append(el('span','✧','empty-symbol'),el('span','暂无符合筛选条件的场次。'),el('p','请切换学校或清除当天筛选。'));box.append(empty);return;}for(const [index,e] of rows.entries()){const item=el('article',undefined,'event');item.style.animationDelay=Math.min(index,6)*25+'ms';const time=el('div',undefined,'event-time');time.append(el('div',e.start));if(e.end)time.append(el('div','— '+e.end,'event-end'));const content=el('div');const tags=el('div');tags.append(el('span',e.school,'event-school'),el('span',e.type,'event-type'));content.append(tags,el('h3',e.co),el('p',e.venue,'event-venue'));const a=el('a',e.link===STATUS.sources[e.school]?'打开学校官方入口 ↗':'查看官方详情 ↗','event-link');a.href=e.link;a.target='_blank';a.rel='noopener noreferrer';content.append(a);if(!STATUS.schools[e.school]?.ok)content.append(el('p','已核实补录或历史留存，最新安排请再与官网确认。','event-warning'));item.append(time,content);box.append(item);}}
function showDay(d){selectedDate=d;openedDate=d;const date=new Date(d+'T12:00:00');$('#dayTitle').textContent=`${date.getMonth()+1} 月 ${date.getDate()} 日 · 星期${weekdays[date.getDay()]}`;$('#dayYear').textContent=`${date.getFullYear()} / 当日活动`;const select=$('#daySchool');select.replaceChildren();const base=EVENTS.filter(e=>e.d===d&&baseMatches(e));const all=el('option',`全部学校 · ${base.length} 场`);all.value='';select.append(all);for(const s of names){const count=base.filter(e=>e.school===s).length;const option=el('option',`${s} · ${count} 场`);option.value=s;select.append(option);}select.value=$('#school').value;$('#daySearch').value='';renderDay();renderCalendar(false);$('#detail').showModal();}
function renderCalendar(animate=true){const grid=$('#calendar');grid.replaceChildren();$('#monthNumber').textContent=String(month+1).padStart(2,'0');$('#monthTitle').textContent=`${year} 年 ${month+1} 月`;$('#monthEnglish').textContent=english[month]+' / '+year;const rows=EVENTS.filter(matches),prefix=`${year}-${String(month+1).padStart(2,'0')}`;const count=rows.filter(e=>e.d.startsWith(prefix)).length;$('#totals').replaceChildren(el('b',`${count} 场`),document.createTextNode(' 本月活动 · '+EVENTS.length.toLocaleString('zh-CN')+' 场留存'));for(const [i,d] of ['一','二','三','四','五','六','日'].entries())grid.append(el('div',d,'weekday'+(i>4?' weekend':'')));const first=new Date(year,month,1),offset=(first.getDay()+6)%7;for(let i=0;i<42;i++){const date=new Date(year,month,1-offset+i),key=stamp(date),events=rows.filter(e=>e.d===key),day=el('button',undefined,'day'+(date.getMonth()!==month?' other':'')+(key===current?' today':'')+(key===selectedDate?' selected':''));day.setAttribute('aria-label',`${key}，${events.length} 场`);day.setAttribute('aria-pressed',String(key===selectedDate));if(key===current)day.setAttribute('aria-current','date');day.append(el('span',date.getDate(),'date-num'));if(events.length){day.append(el('span',events.length+' 场','count'));for(const e of events.slice(0,2)){const line=el('span',e.start+' '+e.co,'event-preview');line.title=e.school+' · '+e.co;day.append(line);}if(events.length>2)day.append(el('span','另有 '+(events.length-2)+' 场','more'));}day.onclick=()=>showDay(key);grid.append(day);}if(animate){grid.classList.remove('refreshing');void grid.offsetWidth;grid.classList.add('refreshing');}}
function setupStatus(){for(const s of names){const option=el('option',s);option.value=s;$('#school').append(option);const state=STATUS.schools[s]||{},box=el('div',undefined,'school-card'),a=el('a',s+' ↗');a.href=STATUS.sources[s];a.target='_blank';a.rel='noopener noreferrer';box.append(a);const stateText=state.ok?`本轮已更新 · ${state.count} 场`:(state.supplement_count?`已核实补录 ${state.supplement_count} 场 · 自动更新受限`:'本轮未更新');box.append(el('p',stateText,'school-state'+(state.ok?'':' partial')));if(state.last_success)box.append(el('p','最近成功：'+new Date(state.last_success).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})));if(state.error)box.append(el('p',state.error));$('#schools').append(box);}$('#updated').textContent='最近检查：'+new Date(STATUS.attempted_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});const bad=names.filter(s=>!STATUS.schools[s]?.ok);$('#healthNotice').textContent=bad.length?`${bad.join('、')}自动更新暂受限；已核实补录和历史场次仍保留。`:'各校公开信息已完成本轮采集。';if(STATUS.run_url){const a=el('a','查看更新记录 ↗');a.href=STATUS.run_url;a.target='_blank';a.rel='noopener noreferrer';$('#run').append(a);}const date=new Date(current+'T12:00:00'),todayRows=EVENTS.filter(e=>e.d===current);$('#todayNoteTitle').textContent=`${date.getMonth()+1} 月 ${date.getDate()} 日，星期${weekdays[date.getDay()]}`;$('#todayNoteText').textContent=`今日共 ${todayRows.length} 场，可在详情中按学校筛选。`;}
$('#prev').onclick=()=>{if(--month<0){month=11;year--;}renderCalendar();};$('#next').onclick=()=>{if(++month>11){month=0;year++;}renderCalendar();};$('#today').onclick=()=>{[year,month]=current.split('-').map(Number);month--;renderCalendar();};for(const s of ['#school','#type','#search'])$(s).addEventListener('input',()=>renderCalendar());$('#reset').onclick=()=>{$('#school').value='';$('#type').value='';$('#search').value='';renderCalendar();};$('#openToday').onclick=$('#todayNoteOpen').onclick=()=>showDay(current);$('#close').onclick=()=>$('#detail').close();$('#daySchool').onchange=renderDay;$('#daySearch').oninput=renderDay;$('#dayReset').onclick=()=>{$('#daySchool').value='';$('#daySearch').value='';renderDay();};$('#detail').addEventListener('click',e=>{const r=$('#detail').getBoundingClientRect();if(e.target===$('#detail')&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))$('#detail').close();});setupStatus();renderCalendar(false);
</script></body></html>
