<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="上海13校官方宣讲会、双选会、招聘会月历"><title>上海高校 · 招聘日历</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#16322f;background:#f4f6f2;line-height:1.6}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:40px 24px}header{border-bottom:1px solid #cdd8d0;padding-bottom:24px}small,.muted{color:#60736c}h1{font-size:clamp(27px,4vw,44px);letter-spacing:-1px;margin:8px 0}h2{margin:0;font-size:24px}button,select,input{font:inherit;border:1px solid #cbd7ce;border-radius:10px;background:white;padding:9px 14px;color:inherit}button{cursor:pointer}button:hover{background:#e8efe8}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #b18c3d;outline-offset:2px}a{color:#176d58}.tag{font-size:12px;background:#dfece1;border-radius:20px;padding:4px 10px}.tools,.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0}.tools input{flex:1;min-width:190px}.nav h2{flex:1}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:#dce4dc;border:1px solid #dce4dc;border-radius:16px;overflow:hidden}.weekday{padding:12px;background:#eaf0e7;text-align:center;font-size:13px}.day{min-height:130px;padding:10px;background:#fff;text-align:left;border:0;border-radius:0;display:flex;flex-direction:column;gap:5px;overflow:hidden}.day strong{font-size:16px}.day.today strong{color:white;background:#1c604e;border-radius:50%;width:30px;text-align:center}.day.other{background:#f1f4ef;color:#8c9a91}.preview{font-size:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%;color:#426b58}.count{font-size:11px;color:#96712c}.notice{background:#fff5df;padding:14px;border-radius:12px;font-size:13px;margin:16px 0}.status{margin-top:28px}summary{cursor:pointer;font-weight:600}.schools{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:15px}.school{border:1px solid #dae2d8;padding:13px;border-radius:10px;background:white;font-size:12px}.school p{margin:4px 0}.ok{color:#1e704a}.bad{color:#98642e}footer{margin:26px 0;color:#60736c;font-size:12px}dialog{border:0;border-radius:20px;width:min(650px,94vw);padding:26px;max-height:85vh;color:inherit;box-shadow:0 20px 70px #17352e44}dialog::backdrop{background:#15312688}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.event{padding:18px 0;border-bottom:1px solid #e1e7dd}.event h3{margin:5px 0;font-size:17px}.event p{font-size:13px;margin:5px 0}.empty{padding:28px 0;color:#75867b}@media(max-width:600px){main{padding:22px 12px}.day{min-height:90px;padding:6px}.preview{display:none}.weekday{padding:7px}.nav{gap:6px}.nav button{padding:6px 9px}.nav h2{font-size:19px}.tools select{max-width:48%}}
</style></head><body><main>
<header><small>SHANGHAI / CAMPUS RECRUITMENT</small><h1>上海高校 · 招聘日历</h1><p class="muted">13 校官方信息，一页查看宣讲会、双选会与招聘会。</p><span class="tag">每周一 08:00 北京时间计划更新</span><p id="updated" class="muted"></p></header>
<div id="notice" class="notice" hidden></div>
<div class="tools"><label>学校 <select id="school"><option value="">全部学校</option></select></label><label>类型 <select id="type"><option value="">全部类型</option><option>宣讲会</option><option>双选会</option><option>招聘会</option></select></label><input id="search" aria-label="搜索活动或地点" placeholder="搜索活动、公司或地点"></div>
<div class="nav"><h2 id="month"></h2><button id="prev" aria-label="上个月">←</button><button id="today">本月</button><button id="next" aria-label="下个月">→</button></div><p id="totals" class="muted"></p><div id="calendar" class="grid" aria-label="招聘月历"></div>
<details class="status" open><summary>13 校来源与更新状态</summary><div id="schools" class="schools"></div></details>
<footer>时间均为北京时间。点击日期查看当天场次，再点击活动链接进入学校官网。已结束场次保留；未抓取到不代表没有活动。<br>计划时间可能因 GitHub 排队而延迟；各校入校与报名要求以官网为准。历史档案从首次采集开始积累。<span id="run"></span></footer>
</main><dialog id="detail"><div class="dialog-head"><h2 id="dayTitle"></h2><button id="close" aria-label="关闭当天场次">关闭</button></div><div id="dayEvents"></div></dialog>
<script>
const EVENTS = __EVENTS__;
const STATUS = __STATUS__;
const $=s=>document.querySelector(s);
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const chinaToday=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const current=chinaToday();let [year,month]=current.split('-').map(Number);month--;
const stamp=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const matches=e=>(!$('#school').value||e.school===$('#school').value)&&(!$('#type').value||e.type===$('#type').value)&&[e.co,e.venue,e.school].join(' ').toLowerCase().includes($('#search').value.toLowerCase());
function showDay(d){$('#dayTitle').textContent=d;const box=$('#dayEvents');box.replaceChildren();const rows=EVENTS.filter(e=>e.d===d&&matches(e));if(!rows.length)box.append(el('p','当前筛选下暂无已收录场次，请同时查看各校更新状态。','empty'));for(const e of rows){const item=el('article',undefined,'event');item.append(el('span',e.school+' · '+e.type,'tag'),el('h3',e.co),el('p',e.start+(e.end?' – '+e.end:'')+'  ·  '+e.venue));const a=el('a',e.link===STATUS.sources[e.school]?'打开官方列表 / 首页 ↗':'查看官方详情 ↗');a.href=e.link;a.target='_blank';a.rel='noopener noreferrer';item.append(a);if(!STATUS.schools[e.school]?.ok)item.append(el('p','该校本轮未更新，此条来自已核实补录或历史缓存，请以官网最新公告为准。','bad'));box.append(item);}$('#detail').showModal();}
function render(){const grid=$('#calendar');grid.replaceChildren();$('#month').textContent=`${year} 年 ${month+1} 月`;const rows=EVENTS.filter(matches);$('#totals').textContent=`本月收录 ${rows.filter(e=>e.d.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)).length} 场 · 档案共 ${EVENTS.length} 场`;for(const d of ['一','二','三','四','五','六','日'])grid.append(el('div',d,'weekday'));const first=new Date(year,month,1);const offset=(first.getDay()+6)%7;for(let i=0;i<42;i++){const date=new Date(year,month,1-offset+i),key=stamp(date),day=el('button',undefined,'day'+(date.getMonth()!==month?' other':'')+(key===current?' today':''));const events=rows.filter(e=>e.d===key);day.setAttribute('aria-label',`${key}，${events.length} 场`);day.append(el('strong',date.getDate()));if(events.length){day.append(el('span',events.length+' 场','count'));for(const e of events.slice(0,2))day.append(el('span',e.start+' '+e.co,'preview'));}day.addEventListener('click',()=>showDay(key));grid.append(day);}}
for(const s of Object.keys(STATUS.sources)){const option=el('option',s);$('#school').append(option);const state=STATUS.schools[s]||{},box=el('div',undefined,'school'),a=el('a',s+' ↗');a.href=STATUS.sources[s];a.target='_blank';a.rel='noopener noreferrer';box.append(a,el('p',state.ok?`本轮成功 · ${state.count} 场`:(state.supplement_count?`已核实补录 ${state.supplement_count} 场 · 自动更新受限`:'本轮未更新 / 待验证'),state.ok?'ok':'bad'));if(state.last_success)box.append(el('p','最近成功：'+new Date(state.last_success).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})));if(state.error)box.append(el('p',state.error));$('#schools').append(box);}
$('#updated').textContent='最近采集尝试：'+new Date(STATUS.attempted_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'（北京时间）';const bad=Object.keys(STATUS.sources).filter(s=>!STATUS.schools[s]?.ok);if(bad.length){$('#notice').hidden=false;$('#notice').textContent=`${bad.length} 校本轮未更新：${bad.join('、')}。旧记录仍保留；请通过下方官方入口核对。`;}
if(STATUS.run_url){const a=el('a',' · 查看本轮自动运行记录');a.href=STATUS.run_url;$('#run').append(a);}
$('#prev').onclick=()=>{if(--month<0){month=11;year--;}render();};$('#next').onclick=()=>{if(++month>11){month=0;year++;}render();};$('#today').onclick=()=>{[year,month]=current.split('-').map(Number);month--;render();};for(const s of ['#school','#type','#search'])$(s).addEventListener('input',render);$('#close').onclick=()=>$('#detail').close();$('#detail').addEventListener('click',e=>{if(e.target===$('#detail'))$('#detail').close();});render();
</script></body></html>
